name: cloud-ci

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloud-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  MEGAFLOYD_VERSION: cloud-ci-${{ github.sha }}

jobs:
  linux-amd64:
    name: linux/amd64 build, CLI smoke, installer
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: floyd-go/go.mod
          cache-dependency-path: floyd-go/go.sum

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          package_json_file: floyd-code/package.json

      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: floyd-code/.nvmrc
          cache: pnpm
          cache-dependency-path: floyd-code/pnpm-lock.yaml

      - name: Report toolchain
        run: |
          set -euo pipefail
          go version
          node --version
          pnpm --version

      - name: Verify the prompt packs match the canonical pack
        run: node scripts/verify-prompt-pack.mjs

      - name: Verify the ship manifest policy pin
        run: node scripts/verify-ship-manifest.mjs --checkout-only

      - name: Vet Go packages
        working-directory: floyd-go
        run: go vet ./...

      - name: Verify go.mod is tidy
        working-directory: floyd-go
        run: go mod tidy -diff

      - name: Lint Go packages
        uses: golangci/golangci-lint-action@4afd733a84b1f43292c63897423277bb7f4313a9 # v8
        with:
          working-directory: floyd-go
          version: v2.6
          # Enforce the curated linters on changed code first; the
          # pre-existing repo-wide debt is retired separately.
          args: --timeout=10m --new-from-rev=origin/main

      - name: Test the prompt and config packages
        working-directory: floyd-go
        env:
          GO_COVERAGE_FLOOR: "40"
        run: |
          set -euo pipefail
          go test -count=1 -coverprofile="$RUNNER_TEMP/go-cover.out" ./internal/agent/prompt/... ./internal/config/... ./internal/csync/... ./internal/cmd/... ./internal/agent/... ./internal/deletionguard/... ./internal/approvalauthority/... ./internal/question/... ./internal/backend/... ./internal/app/... ./internal/server/...
          python3 - <<'PY'
          import os
          import sys

          floor = float(os.environ["GO_COVERAGE_FLOOR"])
          covered = total = 0
          with open(os.path.join(os.environ["RUNNER_TEMP"], "go-cover.out")) as f:
              for line in f:
                  if line.startswith("mode:"):
                      continue
                  parts = line.split()
                  if len(parts) != 3:
                      continue
                  num_statements = int(parts[1])
                  count = int(parts[2])
                  total += num_statements
                  if count > 0:
                      covered += num_statements
          pct = (covered / total * 100.0) if total else 0.0
          print(f"Go statement coverage: {pct:.1f}% (floor {floor:.0f}%)")
          if pct < floor:
              raise SystemExit(f"Go coverage {pct:.1f}% is below the {floor:.0f}% floor")
          PY

      - name: Verify protected approval authority across OS identities
        run: bash scripts/verify-approval-authority-linux.sh

      - name: Verify cross-filesystem moves are rejected before execution
        working-directory: floyd-go
        run: |
          python3 - <<'PY'
          import json
          import subprocess
          import sys

          name = "TestMoveRecoveryActualLinuxCrossFilesystemDeniedBeforeConfirmation"
          result = subprocess.run(["go", "test", "-json", "./internal/deletionguard", "-run", "^" + name + "$", "-count=1"], capture_output=True, text=True)
          sys.stdout.write(result.stdout)
          sys.stderr.write(result.stderr)
          if result.returncode:
              raise SystemExit(result.returncode)
          events = [json.loads(line) for line in result.stdout.splitlines()]
          assert any(e.get("Test") == name and e.get("Action") == "pass" for e in events), "Cross-filesystem rejection must actually run and pass"
          assert not any(e.get("Test") == name and e.get("Action") == "skip" for e in events), "A skipped cross-filesystem fixture is not verification"
          PY

      - name: Check the comment-free packages
        working-directory: floyd-code
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile
          node scripts/check-no-comments.mjs

      - name: Run the TypeScript test suite with coverage
        working-directory: floyd-code
        run: |
          set -euo pipefail
          pnpm exec vitest run --coverage --silent

      - name: Build linux/amd64
        working-directory: floyd-go
        env:
          CGO_ENABLED: "0"
          GOEXPERIMENT: greenteagc
          GOOS: linux
          GOARCH: amd64
        run: |
          set -euo pipefail
          go build -trimpath \
            -ldflags "-s -w -X github.com/legacy-ai/floyd/internal/version.Version=${MEGAFLOYD_VERSION}" \
            -o "$RUNNER_TEMP/megafloyd" .

      - name: Check binary and CLI output
        run: |
          set -euo pipefail
          file "$RUNNER_TEMP/megafloyd"
          "$RUNNER_TEMP/megafloyd" --version | tee "$RUNNER_TEMP/version.txt"
          "$RUNNER_TEMP/megafloyd" --help | tee "$RUNNER_TEMP/help.txt"
          grep -q "version ${MEGAFLOYD_VERSION}" "$RUNNER_TEMP/version.txt"
          grep -q -- "--data-dir" "$RUNNER_TEMP/help.txt"

      - name: Install into a temporary prefix
        run: |
          set -euo pipefail
          prefix="$RUNNER_TEMP/megafloyd-prefix"
          bash scripts/install-megafloyd.sh \
            --no-service-user \
            --skip-prereqs \
            --prefix "$prefix" \
            --binary "$RUNNER_TEMP/megafloyd" \
            2>&1 | tee "$RUNNER_TEMP/install.log"
          {
            echo "### install-megafloyd.sh output"
            echo '```text'
            cat "$RUNNER_TEMP/install.log"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Run the installed launcher
        run: |
          set -euo pipefail
          prefix="$RUNNER_TEMP/megafloyd-prefix"
          export MEGAFLOYD_HOME="$RUNNER_TEMP/megafloyd-home"
          "$prefix/bin/megafloyd" --version | tee "$RUNNER_TEMP/launcher-version.txt"
          grep -q "version ${MEGAFLOYD_VERSION}" "$RUNNER_TEMP/launcher-version.txt"
          "$prefix/bin/megafloyd" dirs

      - name: Capture logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cloud-ci-logs
          path: |
            ${{ runner.temp }}/version.txt
            ${{ runner.temp }}/help.txt
            ${{ runner.temp }}/install.log
            ${{ runner.temp }}/launcher-version.txt
          if-no-files-found: warn
          retention-days: 7
